# Multi-Bagger Research System Configuration
# Copy this file to config.yml and customize for your environment

# Market Configuration
markets:
  - US          # NYSE, NASDAQ
  - INDIA       # NSE, BSE (future)

# Universe Settings
universe:
  size_target: 5000                    # Total stocks to analyze
  min_market_cap: 100_000_000         # $100M minimum
  min_daily_volume: 100_000           # 100K shares minimum
  min_price: 5.00                     # $5 minimum price
  exclude_otc: true                   # Exclude OTC/Pink Sheet stocks
  exclude_adrs: true                  # Exclude ADRs initially

# Data Sources (API Configuration)
data_sources:
  primary: YAHOO                      # Yahoo Finance (free)
  backup: ALPHA_VANTAGE              # Alpha Vantage (free tier)
  fundamental: FMP                    # Financial Modeling Prep

# API Rate Limits (requests per minute)
rate_limits:
  yahoo: 2000                        # No official limit, be conservative
  alpha_vantage: 5                   # Free tier: 5/min, 500/day
  fmp: 250                           # Free tier: 250/day

# Data Layer Configuration
data:
  # Cache settings
  cache:
    backend: SQLITE                  # SQLITE or REDIS
    sqlite_path: "data/http_cache.db"
    redis_url: "redis://localhost:6379/0"
    in_memory_hot_cache: true        # Keep recent entries in memory
    hot_cache_size: 1000             # Max entries in memory

  # TTL policies (days)
  ttl:
    price: 1                         # Price data: 1 day
    fundamental: 90                  # Fundamentals: 90 days
    instrument: 30                   # Instrument metadata: 30 days
    filing: 365                      # SEC filings: 1 year

  # Data sources configuration
  sources:
    yahoo:
      enabled: true
      rate_limit_per_minute: 2000
      user_agent: "MultiBagger/1.0"
      timeout_seconds: 30
    alpha_vantage:
      enabled: false
      rate_limit_per_minute: 5
      api_key: "${ALPHA_VANTAGE_KEY}"
      timeout_seconds: 30
    edgar:
      enabled: true
      rate_limit_per_minute: 10
      user_agent: "MultiBagger/1.0 (contact@example.com)"
      timeout_seconds: 30
    screener_in:
      enabled: false
      rate_limit_per_minute: 60
      timeout_seconds: 30

  # Batching and concurrency
  batching:
    max_concurrent_requests: 5
    batch_size: 50
    retry_attempts: 3
    retry_backoff_seconds: 1
    jitter: true

  # Operational settings
  cache_only_mode: false             # Use cache only, no network calls
  deterministic_mode: true           # Pin timestamps for reproducible runs

# Caching Configuration
cache:
  backend: FILE                      # FILE or REDIS
  redis_url: "redis://localhost:6379/0"
  ttl:
    price_data: 86400               # 1 day (seconds)
    fundamental_data: 2592000       # 30 days
    universe_data: 604800           # 7 days

# Database Configuration
database:
  url: "sqlite:///data/multibagger.db"
  echo: false                       # Set to true for SQL debugging
  pool_size: 5
  max_overflow: 10

# Screening Configuration
screening:
  stages:
    quick_filter: 500               # Stage 1: 5000 → 500 stocks
    quality_filter: 100             # Stage 2: 500 → 100 stocks
    business_filter: 30             # Stage 3: 100 → 30 stocks
    red_flag_filter: 15             # Stage 4: 30 → 15 stocks

  # Factor weights (equal initially)
  factor_weights:
    profitability: 0.25             # ROE, ROCE, ROIC
    growth: 0.25                    # Revenue/earnings growth
    quality: 0.25                   # Debt ratios, consistency
    valuation: 0.25                 # P/E, EV/EBITDA relative

# Screening Pipeline (Phase 2)
screen:
  # Stage 2.1: Quick Screener (Fast filters)
  fast:
    allowed_exchanges: ["NYSE", "NASDAQ", "NSE"]
    min_price_usd: 5.0              # $5 minimum for US stocks
    min_price_inr: 100.0            # ₹100 minimum for Indian stocks
    min_adv: 100000                 # Average daily volume
    min_market_cap: 100000000       # $100M minimum
    exclude_etf: true
    exclude_adr: true
    exclude_otc: true
    exclude_penny: true

  # Stage 2.2: Quality Filter (Financial quality)
  quality:
    min_roce: 15.0                  # % Return on Capital Employed
    min_revenue_cagr_5y: 10.0       # % 5-year revenue CAGR
    min_gross_margin: 20.0          # % Gross margin
    max_debt_to_equity: 1.0         # Maximum leverage
    min_fcf_margin: 0.0             # % Free cash flow margin (0 = no filter)

  # Stage 2.3: Business Filter (Consistency & cash generation)
  business:
    min_positive_fcf_years: 3       # Positive FCF in at least 3 of last 5 years
    min_cumulative_5yr_fcf: 0       # 5-year cumulative FCF must be positive
    max_margin_volatility: 10.0     # % Maximum gross margin std dev
    min_years_data: 3               # Minimum years of fundamental data required
    min_reinvestment_rate: 0.0      # % (optional, 0 = no filter)
    max_reinvestment_rate: 100.0    # % (optional, 100 = no filter)

# Stage 2.4: Red Flag Detection (Phase 3)
# Multi-layer risk assessment with forensic accounting, governance, and sentiment
risk:
  # Composite score weights (MVP: forensics-only)
  weights:
    forensics: 1.0                  # Forensic accounting (Beneish, Altman, Sloan)
    governance: 0.0                 # Governance/insider activity (stub for MVP)
    sentiment: 0.0                  # News sentiment (stub for MVP)

  # Hard-stop thresholds (priority-ordered elimination)
  thresholds:
    # Beneish M-Score: Earnings manipulation detector
    # Priority 1: M-Score > -2.22 indicates high manipulation probability
    beneish_cutoff: -2.22           # Above this = "beneish_m_score_high"

    # Altman Z-Score: Bankruptcy predictor
    # Priority 2: Z-Score < 1.81 indicates distress zone
    altman_distress: 1.81           # Below this = "altman_z_score_distress"

    # Sloan Accruals: Earnings quality assessment
    # Priority 3: Accruals > 0.10 indicates earnings quality concerns
    sloan_warning: 0.10             # Above this = "sloan_accruals_high"

    # Composite score: Weighted risk score (0=low risk, 100=high risk)
    # Stocks with composite > 40 are eliminated
    composite_score_max: 40.0       # Maximum acceptable composite risk score

# Phase 4: Research & Valuation
research:
  # DCF Valuation Parameters
  dcf:
    discount_rate_pct: 10.0         # WACC proxy for cost of capital
    terminal_g_pct: 2.5             # Perpetuity growth rate
    exit_multiple_ev_fcf: 12.0      # Exit multiple sanity check
    growth_spread_pct: 4.0          # ± spread for Bear/Bull scenarios
    margin_spread_pct: 2.0          # ± margin spread for scenarios
    tax_rate_pct: 25.0              # Corporate tax rate
    projection_years: 5             # Years to project

  # Business Analysis
  filings:
    us_edgar_enabled: true          # Fetch 10-K/10-Q from SEC
    in_mca_enabled: false           # India MCA (future)
    cache_ttl_days: 90              # Cache filings for 90 days
    request_delay_ms: 200           # Delay between EDGAR requests

  # Report Generation
  outputs:
    pdf: true                       # Generate PDF reports
    markdown: true                  # Generate Markdown reports
    template: "research_report.md.j2"  # Jinja2 template name

  # Limits & Performance
  limits:
    max_reports: 15                 # Max reports per run (performance limit)
    filing_timeout_seconds: 10      # Timeout for filing fetch per ticker
    max_peers_for_comps: 10         # Max peer companies for comparables

  # Quality Guardrails
  guardrails:
    max_valuation_multiple: 5.0     # Flag if DCF > 5x current price
    min_fcf_years: 3                # Min positive FCF years for valuation
    max_comps_divergence_pct: 30.0  # Flag if DCF > 30% vs peer median

# Portfolio Configuration
portfolio:
  # Position limits
  max_positions: 15                 # Maximum concurrent holdings
  top_n_candidates: 15              # Top N from research to consider for model

  # Weight caps (percentage)
  max_weight_pct: 20.0              # Maximum weight for single position
  min_weight_pct: 3.0               # Minimum weight to include (else drop)
  drift_tolerance_pct: 2.0          # ±% drift before triggering rebalance action

  # Risk management
  stop_loss_pct: -25.0              # Flag positions down >25% (informational)

  # Legacy position sizing (for future use)
  position_sizing:
    high_conviction: 0.20           # 20% for score > 90
    medium_conviction: 0.15         # 15% for score 80-90
    low_conviction: 0.10            # 10% for score < 80
  rebalance_threshold: 0.05         # 5% weight drift triggers rebalance

# Reporting Configuration
reports:
  output_format: PDF                # PDF, HTML, or BOTH
  template_dir: "templates/"
  output_dir: "reports/"
  include_charts: true
  max_report_pages: 10

# Monitoring Configuration
monitoring:
  # Daily portfolio monitoring signals
  near_target_pct: 0.90             # Alert when current >= target * 0.90
  stop_loss_pct: -0.25              # Default stop loss: entry * 0.75
  min_upside_pct: 0.05              # Thesis risk if upside < 5%

  # Active signals to check
  signals:
    - STOP_LOSS                     # Price breach downside protection
    - NEAR_TARGET                   # Price approaching DCF fair value
    - THESIS_RISK                   # New red flags or low upside

  # Legacy alert thresholds (deprecated)
  alert_thresholds:
    stop_loss: -0.25                # 25% decline alert
    target_approach: 0.90           # 90% of target price alert
    volume_spike: 3.0               # 3x average volume alert

  check_frequency: "daily"          # daily, hourly
  news_sources:
    - "yahoo_finance"
    - "reuters"
    - "bloomberg"                   # If API available

# Execution Configuration
execution:
  monthly_run_day: 1                # 1st day of month
  max_runtime_minutes: 60           # Kill job after 1 hour
  parallel_workers: 4               # For data fetching
  chunk_size: 100                   # Stocks per batch

# Logging Configuration
logging:
  level: INFO                       # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/multibagger.log"
  max_file_size: 10485760          # 10MB
  backup_count: 5
  
# Development Configuration
dev:
  debug_mode: false
  sample_mode: false                # Use small sample for testing
  sample_size: 50                   # Stocks in sample mode
  skip_cache: false                 # Force fresh API calls
